<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .scrapbook-shell {
        background: #f6f0e7;
        border: 1px solid #d8c7aa;
        box-shadow: 0 10px 30px rgba(69, 41, 14, 0.12);
        padding: 1.5rem;
        position: relative;
        font-family: Georgia, "Times New Roman", serif;
        color: #2f261f;
      }

      .scrapbook-shell::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(95, 72, 47, 0.35);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.7rem;
        color: #7b5d3a;
      }

      .stamp {
        border: 2px solid rgba(117, 88, 57, 0.8);
        color: #6a4f35;
        transform: rotate(8deg);
        padding: 0.35rem 0.75rem;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .album-notes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .note {
        background: rgba(255,255,255,0.5);
        border: 1px solid rgba(109, 81, 53, 0.35);
        padding: 0.5rem 0.8rem;
        font-size: 0.9rem;
      }

      .note.accent {
        font-style: italic;
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .page-button,
      .page-number,
      .modal-nav,
      .modal-close {
        border: 1px solid rgba(95, 72, 47, 0.7);
        background: #fffaf2;
        color: #2f261f;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .page-button,
      .page-number {
        padding: 0.45rem 0.8rem;
      }

      .page-button:hover,
      .page-number:hover,
      .modal-nav:hover,
      .modal-close:hover {
        background: #efe0c7;
      }

      .page-number.active {
        background: #d4b48a;
        font-weight: 700;
      }

      .page-numbers {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        flex: 1;
      }

      .page-summary {
        margin-bottom: 1rem;
        font-size: 0.95rem;
        color: #544331;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 1rem;
      }

      .photo-card {
        background: rgba(255,255,255,0.35);
        border: 1px solid rgba(109, 81, 53, 0.2);
        padding: 0.5rem 0.5rem 0.75rem;
        transform: rotate(var(--rotation, 0deg));
        box-shadow: 0 5px 10px rgba(0,0,0,0.08);
      }

      .photo-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        cursor: pointer;
        border: 1px solid rgba(84, 63, 41, 0.5);
      }

      .photo-card figcaption {
        margin-top: 0.5rem;
        text-align: center;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5c4735;
      }

      .photo-modal {
        position: fixed;
        inset: 0;
        background: rgba(18, 12, 9, 0.82);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }

      .photo-modal.open {
        display: flex;
      }

      .modal-content {
        position: relative;
        max-width: 92vw;
        max-height: 92vh;
        background: rgba(255, 255, 255, 0.04);
        padding: 1rem;
      }

      .modal-content img {
        max-width: 92vw;
        max-height: 82vh;
        display: block;
        object-fit: contain;
      }

      .modal-caption-wrap {
        text-align: center;
        color: #f5efe8;
        padding-top: 0.75rem;
      }

      .modal-title {
        margin: 0;
        font-size: 1rem;
      }

      .modal-nav,
      .modal-close {
        position: absolute;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 1.25rem;
        z-index: 1;
      }

      .modal-close {
        top: 1rem;
        right: 1rem;
      }

      .modal-prev {
        left: -18px;
        top: 50%;
        transform: translateY(-50%);
      }

      .modal-next {
        right: -18px;
        top: 50%;
        transform: translateY(-50%);
      }

      @media (max-width: 767px) {
        .modal-prev {
          left: 0.5rem;
        }

        .modal-next {
          right: 0.5rem;
        }
      }
    </style>
    <title>Family History</title>
    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>

  <body>
    
    <div class="container">
      <div class="mb-4 pb-2 border-bottom">
        <h1>Family History</h1>

        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Family History</li>
        </ol>

        <p>
        	We hope to catalog the items we have aquired so that they can be remembered by all.
        </p>
      </div>

      <ul id="catalog">
      </ul>

      <div id="item" class="container"></div>
    </div>
    
    <footer id="footer">
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/2.1.3/mustache.min.js"></script>
    <script src="/js/chamfam.js"></script>
    <script type="x-tmpl-mustache" id="template">
      <a href="items.html" onclick="return back()">Back to list</a>

      {{# name}}
          <h2>{{name}}</h2>
          <div class="row">
              <div class="col-md-4">
              <dl>
                  <dt>Description</dt>
                  <dd>{{description}}</dd>

                  <dt>Family Member</dt>
                  <dd>{{owner}}</dd>

                  <dt>FamilySearch ID</dt>
                  <dd>{{fsid}}</dd>

                  <dt>Demensions</dt>
                  <dd>{{demensions}}</dd>

                  <dt>Material</dt>
                  <dd>{{material}}</dd>
              </dl>
              </div>
              {{#photos}}
              <div class="col-md-4">
              <img src="./data/{{.}}" alt="{{name}}" class="img-fluid img-thumbnail"/>
              </div>
              {{/photos}}
          </div>

          {{> stories}}
      {{/name}}

      {{^ name}}
          <h2>Item Not Found</h2>
      {{/name}}

    </script>
    <script type="x-tmpl-mustache" id="storiesTemplate">
      <h2>Stories</h2>

      {{#stories}}
          {{#details}}
          <p>{{.}}</p>
          {{/details}}
          <p> - {{source}}</p>
      {{/stories}}

      <a href="mailto:chamfamdad@gmail.com?subject={{name}}({{id}})">Send me your story about this item.</a>
    </script>
    <script type="text/javascript">
      let inventory;
      let notFound;
      let scrapbookKeyHandler;

      function onItem( id ){
        if (!inventory) {
          return false;
        }

        document.getElementById("catalog").style.display = "none";

        const targetId = Number(id);
        let item = inventory.find(item => Number(item.id) === targetId)
        
        if(!item) {
          item = notFound;
        }

        const isScrapbook = item && item.type === 'scrapbook';
        const storiesTemplate = document.getElementById("storiesTemplate").innerHTML;

        if (isScrapbook) {
          document.getElementById("item").innerHTML = `
            <a href="items.html" onclick="return back()">Back to list</a>

            <div class="scrapbook-shell">

              <section class="album-notes" aria-label="Album notes">
                <div class="note">${item.name}</div>
                <div class="note accent">Friends, milestones, and everyday moments</div>
              </section>

              <nav class="pagination-controls" aria-label="Photo pages">
                <button id="prevPage" class="page-button" type="button" aria-label="Previous page">Previous</button>
                <div id="pageNumbers" class="page-numbers" aria-label="Page number list"></div>
                <button id="nextPage" class="page-button" type="button" aria-label="Next page">Next</button>
              </nav>

              <p id="pageSummary" class="page-summary" aria-live="polite"></p>
              <section class="photo-grid" id="photoGallery" aria-label="Scrapbook photo gallery"></section>
            </div>

            <div class="mt-4">
              ${Mustache.to_html( storiesTemplate, item )}
            </div>

            <div id="photoModal" class="photo-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
              <button id="closeModal" class="modal-close" type="button" aria-label="Close photo">×</button>
              <div class="modal-content">
                <button id="prevPhoto" class="modal-nav modal-prev" type="button" aria-label="Previous photo">&#10094;</button>
                <button id="nextPhoto" class="modal-nav modal-next" type="button" aria-label="Next photo">&#10095;</button>
                <img id="modalImage" src="" alt="Full-size scrapbook photo">
                <div class="modal-caption-wrap">
                  <p id="modalTitle" class="modal-title">Scrapbook photo</p>
                </div>
              </div>
            </div>
          `;

          initializePhotoAlbum(item.scrapbookDir, item.photoCount);
        } else {
          const template = document.getElementById("template").innerHTML;
          const output = Mustache.to_html( template, item, { stories: storiesTemplate } );
          document.getElementById("item").innerHTML = output;
        }

        document.getElementById("item").style.display = "block";
        updateDocumentHistory(targetId);
        document.title = "Family History - " + item.name;

        return false;
      }

      function initializePhotoAlbum(photoAlbumBasePath, photoCount) {
        const albumBasePath = typeof photoAlbumBasePath === 'string' ? photoAlbumBasePath.trim() : '';
        const gallery = document.getElementById('photoGallery');
        const prevPageButton = document.getElementById('prevPage');
        const nextPageButton = document.getElementById('nextPage');
        const pageNumbers = document.getElementById('pageNumbers');
        const pageSummary = document.getElementById('pageSummary');
        const photoModal = document.getElementById('photoModal');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalButton = document.getElementById('closeModal');
        const prevPhotoButton = document.getElementById('prevPhoto');
        const nextPhotoButton = document.getElementById('nextPhoto');

        if (!gallery || !prevPageButton || !nextPageButton || !pageNumbers || !pageSummary) {
          return;
        }

        if (!albumBasePath) {
          pageSummary.textContent = 'No scrapbook directory configured.';
          return;
        }

        if (!photoCount) {
          pageSummary.textContent = 'No scrapbook photo count configured.';
          return;
        }

        const photosPerPage = 24;
        const photoNumbers = Array.from({ length: photoCount }, (_, index) => index + 1);
        const totalPages = Math.ceil(photoNumbers.length / photosPerPage);
        let currentPage = 1;
        let currentPhotoNumber = null;

        function padPhotoNumber(photoNumber) {
          return String(photoNumber).padStart(3, '0');
        }

        function updateModalButtons() {
          prevPhotoButton.disabled = currentPhotoNumber === Math.min(...photoNumbers);
          nextPhotoButton.disabled = currentPhotoNumber === Math.max(...photoNumbers);
        }

        function openModal(photoNumber) {
          currentPhotoNumber = photoNumber;
          const imageNumber = padPhotoNumber(photoNumber);
          modalImage.src = `${albumBasePath}/${imageNumber}.jpg`;
          modalImage.alt = `Scrapbook photo ${imageNumber}`;
          modalTitle.textContent = `Photo ${imageNumber}`;
          photoModal.classList.add('open');
          photoModal.setAttribute('aria-hidden', 'false');
          updateModalButtons();
        }

        function closeModal() {
          photoModal.classList.remove('open');
          photoModal.setAttribute('aria-hidden', 'true');
          modalImage.src = '';
          modalTitle.textContent = 'Scrapbook photo';
          currentPhotoNumber = null;
        }

        function navigateModal(direction) {
          if (currentPhotoNumber === null) {
            return;
          }

          const nextPhoto = currentPhotoNumber + direction;
          if (nextPhoto < 1 || nextPhoto > photoNumbers.length) {
            return;
          }

          currentPhotoNumber = nextPhoto;
          openModal(currentPhotoNumber);
        }

        function renderPageControls() {
          pageNumbers.innerHTML = '';

          for (let page = 1; page <= totalPages; page += 1) {
            const pageButton = document.createElement('button');
            pageButton.type = 'button';
            pageButton.className = `page-number${page === currentPage ? ' active' : ''}`;
            pageButton.textContent = page;
            pageButton.setAttribute('aria-label', `Go to page ${page}`);
            pageButton.disabled = page === currentPage;
            pageButton.addEventListener('click', () => {
              currentPage = page;
              renderGallery();
            });
            pageNumbers.appendChild(pageButton);
          }
        }

        function renderGallery() {
          const start = (currentPage - 1) * photosPerPage;
          const end = start + photosPerPage;
          const visiblePhotos = photoNumbers.slice(start, end);

          gallery.innerHTML = '';

          visiblePhotos.forEach((photoNumber, index) => {
            const imageNumber = padPhotoNumber(photoNumber);
            const figure = document.createElement('figure');
            figure.className = 'photo-card';
            figure.style.setProperty('--rotation', `${((index + currentPage) % 5 - 2) * 3.5}deg`);

            const img = document.createElement('img');
            img.src = `${albumBasePath}/${imageNumber}.jpg`;
            img.alt = `Scrapbook photo ${imageNumber}`;
            img.loading = 'lazy';
            img.addEventListener('click', () => openModal(photoNumber));

            const caption = document.createElement('figcaption');
            caption.textContent = `Photo ${imageNumber}`;

            figure.appendChild(img);
            figure.appendChild(caption);
            gallery.appendChild(figure);
          });

          const firstPhoto = start + 1;
          const lastPhoto = Math.min(end, photoNumbers.length);
          pageSummary.textContent = `Showing ${firstPhoto}-${lastPhoto} of ${photoNumbers.length} photos`;

          prevPageButton.disabled = currentPage === 1;
          nextPageButton.disabled = currentPage === totalPages;

          renderPageControls();
        }

        prevPageButton.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage -= 1;
            renderGallery();
          }
        });

        nextPageButton.addEventListener('click', () => {
          if (currentPage < totalPages) {
            currentPage += 1;
            renderGallery();
          }
        });

        closeModalButton.addEventListener('click', closeModal);
        prevPhotoButton.addEventListener('click', () => navigateModal(-1));
        nextPhotoButton.addEventListener('click', () => navigateModal(1));

        photoModal.addEventListener('click', (event) => {
          if (event.target === photoModal) {
            closeModal();
          }
        });

        // only one scrapbook is shown at a time, so replace any earlier key handler
        if (scrapbookKeyHandler) {
          document.removeEventListener('keydown', scrapbookKeyHandler);
        }

        scrapbookKeyHandler = (event) => {
          if (!photoModal.classList.contains('open')) {
            return;
          }

          if (event.key === 'Escape') {
            closeModal();
          } else if (event.key === 'ArrowLeft') {
            navigateModal(-1);
          } else if (event.key === 'ArrowRight') {
            navigateModal(1);
          }
        };

        document.addEventListener('keydown', scrapbookKeyHandler);

        renderGallery();
      }

      function back() {
        document.getElementById("item").style.display = "none";
        document.getElementById("catalog").style.display = "block";

        updateDocumentHistory();
        document.title = "Family History";    

        return false;
      }

      // sets document history
      function updateDocumentHistory(id) {
        if(id) {
          if ('URLSearchParams' in window) {
            const searchParams = new URLSearchParams(window.location.search);
            searchParams.set("id", id);
            const newRelativePathQuery = window.location.pathname + '?' + searchParams.toString();
            history.pushState(null, '', newRelativePathQuery);      
          }
        }
        else {
          history.pushState(null, '', window.location.pathname);  
        }
      }
      
      // execute on page load
      (function( document, window ){
        const ul = document.getElementById("catalog");
        
        ul.innerHTML = "";
        
        fetch("./data/itemlist.json")
          .then(response => response.json())
          .then(data => {
            // remove id 0 as it is just a template
            notFound = data.shift();

            // sort by name
            inventory = data.sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()))

            // fill in the list
            data.forEach(item => {
              const li = document.createElement("li");
              li.innerHTML = `<a href="items.html?id=${item.id}" onclick="return onItem(${item.id})">${item.name}</a>`;
              ul.appendChild(li);
            });

            // see if they specified an id
            const urlSearchParams = new URLSearchParams(window.location.search);
            const params = Object.fromEntries(urlSearchParams.entries());

            if(params && params.id) {
              onItem(parseInt(params.id));
            }
          })
          .catch(error => {
            const li = document.createElement("li");
            li.className = "alert alert-danger";
            li.textContent = "Request Failed: " + error.message;
            ul.appendChild(li);
          });

      })( document, window );
    </script>
  </body>
</html>
